name: CI Pipeline - Build, Scan, and Push

# This pipeline triggers every time you push code to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log into DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build the Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dharwad-eats-api:latest .

      # Step 4: Enterprise Security Scan (Trivy)
      # This shows recruiters you care about DevSecOps. It scans the container for vulnerabilities.
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/dharwad-eats-api:latest'
          format: 'table'
          exit-code: '0' # Set to 1 in strict production to fail the build if CRITICAL vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 5: Push to DockerHub
      - name: Push Image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/dharwad-eats-api:latest